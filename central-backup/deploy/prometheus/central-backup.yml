# Trecho para o prometheus.yml (Prometheus no mesmo VPS da central).
# O token fica em arquivo legível só pelo usuário do Prometheus (mesmo valor de METRICS_TOKEN no .env da central).
scrape_configs:
  - job_name: central-backup
    scrape_interval: 60s
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/central-backup.token
    static_configs:
      - targets: ['127.0.0.1:4300']

